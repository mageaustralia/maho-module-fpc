# Mageaustralia_Fpc — nginx configuration
#
# Add these map blocks to the http {} context (e.g. /etc/nginx/nginx.conf):

map $uri $fpc_uri {
    "/"     /index.html;
    default $uri;
}

map $args $fpc_prefix {
    ""      /var/fpc/default;  # Change "default" to your store code
    default "";
}

# Bypass the static cache entirely when the no-cache cookie is present.
# Any module can set EXTERNAL_NO_CACHE to force fully-dynamic rendering for a
# session (e.g. "Login as Customer" admin impersonation, where a per-session
# banner must never be served from a shared cached page). Without this, nginx
# would serve the static file for bare URLs and PHP would never run.
map $http_cookie $fpc_bypass {
    default                 "";
    "~*EXTERNAL_NO_CACHE=1" "1";
}

